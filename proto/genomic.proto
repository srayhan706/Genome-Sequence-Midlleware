syntax = "proto3";

package genomic;

// Genomic analysis RPC service (middleware API)
service GenomicService {
  // Submit sequence alignment (e.g. Smith-Waterman) job
  rpc SequenceAlignment(AlignmentRequest) returns (AlignmentResponse);
  // Submit pattern search (e.g. KMP) job
  rpc PatternSearch(PatternSearchRequest) returns (PatternSearchResponse);
  // Submit k-mer counting job
  rpc KmerCount(KmerCountRequest) returns (KmerCountResponse);
  // Batch: submit multiple sequences for alignment
  rpc BatchAlignment(BatchAlignmentRequest) returns (BatchAlignmentResponse);
  // Health check / worker status
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
  // Live cluster statistics (per-worker load, cache, traffic)
  rpc GetStats(StatsRequest) returns (StatsResponse);
}

// Where and how long a job ran.
message JobInfo {
  int32 worker_rank = 1;   // MPI rank that computed it; 0 = middleware itself
  double compute_ms = 2;   // time spent in the algorithm
  double total_ms = 3;     // middleware time: cache lookup, queueing, MPI, compute
}

message AlignmentRequest {
  string sequence_a = 1;
  string sequence_b = 2;
  int32 match_score = 3;
  int32 mismatch_penalty = 4;
  int32 gap_penalty = 5;
}

message AlignmentResponse {
  string aligned_a = 1;
  string aligned_b = 2;
  int32 score = 3;
  bool cache_hit = 4;
  JobInfo info = 5;
}

message PatternSearchRequest {
  string text = 1;       // genomic sequence
  string pattern = 2;
}

message PatternSearchResponse {
  repeated int32 positions = 1;  // 0-based indices
  int32 count = 2;
  bool cache_hit = 3;
  JobInfo info = 4;
}

message KmerCountRequest {
  string sequence = 1;
  int32 k = 2;
}

message KmerCountResponse {
  map<string, int64> counts = 1;
  bool cache_hit = 2;
  JobInfo info = 3;
}

message BatchAlignmentRequest {
  repeated string sequences = 1;  // pairs: [a1,b1, a2,b2, ...] or single ref + many
  string reference = 2;           // if set, align each in sequences against reference
  int32 match_score = 3;
  int32 mismatch_penalty = 4;
  int32 gap_penalty = 5;
}

message BatchAlignmentResponse {
  repeated AlignmentResponse results = 1;
  double wall_ms = 2;  // end-to-end time for the whole batch (jobs run in parallel)
}

message HealthRequest {}

message HealthResponse {
  int32 worker_count = 1;
  bool ok = 2;
}

message StatsRequest {}

message WorkerStats {
  int32 rank = 1;
  string hostname = 2;
  int32 omp_threads = 3;
  int64 jobs = 4;
  int64 failures = 5;
  int32 active = 6;            // jobs currently running on this rank
  string current_task = 7;     // "align" / "pattern" / "kmer" while active
  double compute_ms = 8;       // cumulative
  int64 bytes_sent = 9;        // middleware -> worker over MPI
  int64 bytes_received = 10;   // worker -> middleware over MPI
}

message StatsResponse {
  repeated WorkerStats workers = 1;
  int64 requests = 2;
  int32 in_flight = 3;
  int64 cache_hits = 4;
  int64 cache_misses = 5;
  int64 cache_entries = 6;
  int64 cache_bytes = 7;
  int64 cache_capacity_bytes = 8;
  double uptime_s = 9;
  bool openmp = 10;            // middleware built with OpenMP
  bool mpi_thread_multiple = 11;
  string coordinator_host = 12;
}
